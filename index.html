<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Your One-Stop Shop</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3498db;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app" class="min-h-screen">
        <!-- Navigation -->
        <nav class="bg-blue-600 text-white p-4">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold">ShopEase</h1>
                <div class="flex items-center gap-4">
                    <button @click="showCart = true" class="relative">
                        <i class="bi bi-cart text-2xl"></i>
                        <span v-if="cart.length" class="absolute -top-2 -right-2 bg-red-500 rounded-full w-5 h-5 flex items-center justify-center text-xs">{{cart.length}}</span>
                    </button>
                    <button v-if="isAdmin" @click="showAddProduct = true" class="bg-white text-blue-600 px-4 py-2 rounded-lg">
                        Add Product
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="container mx-auto p-4">
            <!-- Products Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <div v-for="product in products" :key="product._id" class="bg-white rounded-lg shadow-md overflow-hidden">
                    <img :src="product.image" :alt="product.name" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="font-semibold text-lg">{{product.name}}</h3>
                        <p class="text-gray-600 mt-2">{{product.description}}</p>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="text-lg font-bold">${{product.price}}</span>
                            <button @click="addToCart(product)" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Cart Sidebar -->
        <div v-if="showCart" class="fixed inset-0 bg-black bg-opacity-50 z-50">
            <div class="absolute right-0 top-0 h-full w-full md:w-96 bg-white p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">Your Cart</h2>
                    <button @click="showCart = false" class="text-gray-600"><i class="bi bi-x-lg"></i></button>
                </div>
                <div class="space-y-4">
                    <div v-for="item in cart" :key="item._id" class="flex justify-between items-center">
                        <div>
                            <h4 class="font-medium">{{item.name}}</h4>
                            <p class="text-gray-600">${{item.price}}</p>
                        </div>
                        <button @click="removeFromCart(item)" class="text-red-500"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
                <div class="mt-6">
                    <div class="text-xl font-bold mb-4">Total: ${{cartTotal}}</div>
                    <button @click="checkout" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
                        Checkout
                    </button>
                </div>
            </div>
        </div>

        <!-- Add Product Modal -->
        <div v-if="showAddProduct" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-6 rounded-lg w-full max-w-md">
                <h2 class="text-xl font-bold mb-4">Add New Product</h2>
                <form @submit.prevent="addProduct" class="space-y-4">
                    <div>
                        <label class="block mb-1">Product Name</label>
                        <input v-model="newProduct.name" type="text" class="w-full border p-2 rounded" required>
                    </div>
                    <div>
                        <label class="block mb-1">Description</label>
                        <textarea v-model="newProduct.description" class="w-full border p-2 rounded" required></textarea>
                    </div>
                    <div>
                        <label class="block mb-1">Price</label>
                        <input v-model="newProduct.price" type="number" step="0.01" class="w-full border p-2 rounded" required>
                    </div>
                    <div>
                        <label class="block mb-1">Image URL</label>
                        <input v-model="newProduct.image" type="url" class="w-full border p-2 rounded" required>
                    </div>
                    <div class="flex justify-end gap-2">
                        <button type="button" @click="showAddProduct = false" class="px-4 py-2 text-gray-600">Cancel</button>
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Add Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    products: [],
                    cart: [],
                    showCart: false,
                    showAddProduct: false,
                    isAdmin: true, // Toggle this based on user role
                    newProduct: {
                        name: '',
                        description: '',
                        price: '',
                        image: ''
                    }
                }
            },
            computed: {
                cartTotal() {
                    return this.cart.reduce((total, item) => total + parseFloat(item.price), 0).toFixed(2)
                }
            },
            methods: {
                async fetchProducts() {
                    try {
                        const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer m8ry4PeJ1vfCWZUzumcgfGqvmsp2',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                appSlug: 'shop-app-123456',
                                action: 'read',
                                collection: 'products'
                            })
                        });
                        const data = await response.json();
                        if(data.success) {
                            this.products = data.result;
                        }
                    } catch (error) {
                        console.error('Error fetching products:', error);
                    }
                },
                addToCart(product) {
                    this.cart.push({...product});
                    this.showCart = true;
                },
                removeFromCart(item) {
                    const index = this.cart.findIndex(i => i._id === item._id);
                    if(index > -1) {
                        this.cart.splice(index, 1);
                    }
                },
                async addProduct() {
                    try {
                        const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer m8ry4PeJ1vfCWZUzumcgfGqvmsp2',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                appSlug: 'shop-app-123456',
                                action: 'create',
                                collection: 'products',
                                data: this.newProduct
                            })
                        });
                        const data = await response.json();
                        if(data.success) {
                            this.fetchProducts();
                            this.showAddProduct = false;
                            this.newProduct = {
                                name: '',
                                description: '',
                                price: '',
                                image: ''
                            };
                        }
                    } catch (error) {
                        console.error('Error adding product:', error);
                    }
                },
                async checkout() {
                    // Here you would integrate with a payment gateway like Stripe
                    alert('Proceeding to payment...');
                    // After successful payment, clear cart
                    this.cart = [];
                    this.showCart = false;
                }
            },
            mounted() {
                this.fetchProducts();
            }
        }).mount('#app')
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
